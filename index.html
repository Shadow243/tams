<!DOCTYPE html>
<html lang="en" data-skin="saas" data-bs-theme="dark" data-menu-color="dark" data-topbar-color="dark"
  data-layout-width="fluid" dir="ltr" data-sidenav-size="on-hover-active" data-layout-position="fixed">

<head>
  <meta charset="UTF-8">
  <base href="/">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAMS</title>

  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" /> -->

  <!-- <link rel="stylesheet" type="text/css" href="/css/custom.css?v=1" />
    <link rel="stylesheet" type="text/css" href="/css/vendors.min.css?v=1" />
    <link rel="stylesheet" type="text/css" href="/css/app.min.css?v=1" /> -->
  <!-- <script src="/js/config.js"></script> -->
  <script>
    // Initialize localStorage and window config before any other scripts
    (function () {
      try {
        // Initialize localStorage config keys
        var configKeys = ['hs_config', 'layoutConfig', '__theme_config__', 'themeConfig'];
        configKeys.forEach(function (key) {
          var value = localStorage.getItem(key);
          if (value === null || value === 'undefined' || value === undefined) {
            localStorage.setItem(key, JSON.stringify({}));
          }
        });

        // Initialize window.config and window.defaultConfig for LayoutCustomizer
        window.defaultConfig = window.defaultConfig || {
          skin: 'saas',
          theme: 'dark',
          'menu-color': 'dark',
          'topbar-color': 'dark',
          'layout-width': 'fluid',
          'dir': 'ltr',
          'sidenav-size': 'on-hover-active',
          'layout-position': 'fixed',

          position: 'fixed',
          width: 'fluid',
          dir: 'ltr',
          'sidenav-user': false,
          monochrome: false
        };

        // Try to load saved config or use default
        var savedConfig = sessionStorage.getItem('__THEME_CONFIG__');
        if (savedConfig && savedConfig !== 'undefined') {
          try {
            var parsedConfig = JSON.parse(savedConfig);
            // Merge saved config with defaults, prioritizing saved values but ensuring all keys exist
            window.config = JSON.parse(JSON.stringify(window.defaultConfig));
            Object.keys(parsedConfig).forEach(function (key) {
              window.config[key] = parsedConfig[key];
            });

            // Validate and fix invalid values
            if (window.config.skin === 'default' || !window.config.skin) {
              window.config.skin = 'saas';
            }
          } catch (e) {
            window.config = JSON.parse(JSON.stringify(window.defaultConfig));
          }
        } else {
          window.config = JSON.parse(JSON.stringify(window.defaultConfig));
        }

        // Function to get system theme preference
        function getSystemTheme() {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        // Apply configuration to HTML element
        var html = document.documentElement;
        var config = window.config;

        // Apply theme (handle 'system' theme)
        var actualTheme = config.theme === 'system' ? getSystemTheme() : config.theme;
        html.setAttribute('data-bs-theme', actualTheme);

        // Apply all other attributes with proper fallbacks
        var skin = config.skin;
        if (skin === 'default' || !skin) {
          skin = 'saas';
          config.skin = 'saas'; // Update config to prevent reapplying 'default'
        }
        html.setAttribute('data-skin', skin);
        html.setAttribute('data-menu-color', config['menu-color'] || config['sidenav-color'] || 'dark');
        html.setAttribute('data-topbar-color', config['topbar-color'] || 'dark');
        html.setAttribute('data-layout-width', config['layout-width'] || config.width || 'fluid');
        html.setAttribute('dir', config.dir || 'ltr');
        html.setAttribute('data-sidenav-size', config['sidenav-size'] || 'on-hover-active');
        html.setAttribute('data-layout-position', config['layout-position'] || config.position || 'fixed');

        if (config['sidenav-user']) {
          html.setAttribute('data-sidenav-user', 'true');
        }

        if (config.monochrome) {
          html.classList.add('monochrome');
        }

        // Save the corrected config
        sessionStorage.setItem('__THEME_CONFIG__', JSON.stringify(config));

        // Listen for system theme changes when 'system' is selected
        if (config.theme === 'system') {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
            html.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light');
          });
        }
      } catch (e) {
        console.warn('Unable to initialize config:', e);
        window.config = window.config || {};
        window.defaultConfig = window.defaultConfig || {};
      }
    })();
  </script>
</head>

<body>
  <!--preloader start-->
  <div id="preloader">
    <div id="loader"></div>
  </div>
  <!--preloader end-->

  <div id="app"></div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
