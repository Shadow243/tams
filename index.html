    <!-- <script src="/js/config.js"></script> -->
    <script>
      // Initialize localStorage and window config before any other scripts
      (function() {
        try {
          // Initialize localStorage config keys
          var configKeys = ['hs_config', 'layoutConfig', '__theme_config__', 'themeConfig'];
          configKeys.forEach(function(key) {
            var value = localStorage.getItem(key);
            if (value === null || value === 'undefined' || value === undefined) {
              localStorage.setItem(key, JSON.stringify({}));
            }
          });
          
          // Initialize window.config and window.defaultConfig for LayoutCustomizer
          window.defaultConfig = window.defaultConfig || {
            skin: 'default',
            theme: 'light',
            'sidenav-color': 'light',
            'sidenav-size': 'default',
            'topbar-color': 'light',
            position: 'fixed',
            width: 'fluid',
            dir: 'ltr',
            'sidenav-user': false,
            monochrome: false
          };
          
          // Try to load saved config or use default
          var savedConfig = sessionStorage.getItem('__THEME_CONFIG__');
          if (savedConfig && savedConfig !== 'undefined') {
            try {
              window.config = JSON.parse(savedConfig);
            } catch (e) {
              window.config = JSON.parse(JSON.stringify(window.defaultConfig));
            }
          } else {
            window.config = JSON.parse(JSON.stringify(window.defaultConfig));
          }
        } catch (e) {
          console.warn('Unable to initialize config:', e);
          window.config = window.config || {};
          window.defaultConfig = window.defaultConfig || {};
        }
      })();
    </script>
  </head>
  <body>
        <!--preloader start-->
    <div id="preloader">
        <div id="loader"></div>
    </div>
    <!--preloader end-->

    <div id="app"></div>
